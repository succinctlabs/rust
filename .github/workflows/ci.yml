name: CI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-buildjet:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            triple: aarch64-apple-darwin
          - os: macos-13
            triple: x86_64-apple-darwin
          - os: buildjet-32vcpu-ubuntu-2004
            triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.87.0
      - uses: lukka/get-cmake@v3.27.4

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.21.4
          check-latest: true

      - name: Show rust version
        run: |
          cargo version
          rustup toolchain list

      - name: Check out succinctlabs/rust
        uses: actions/checkout@v3
        with:
          submodules: "recursive"
          path: rust
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Build
        run: |
          cd rust
          ./build_toolchain_succinct.sh

      - name: Archive build output
        uses: actions/upload-artifact@v4
        with:
          name: rust-toolchain-${{ matrix.triple }}
          path: rust/rust-toolchain-${{ matrix.triple }}.tar.gz

  build-runs-on:
    strategy:
      fail-fast: false
    runs-on: [runs-on, runner=32cpu-linux-arm64, image=ubuntu22-full-arm64, "run-id=${{ github.run_id }}"]
    steps:
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.87.0
      - uses: lukka/get-cmake@v3.27.4

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.21.4
          check-latest: true

      - name: Show rust version
        run: |
          cargo version
          rustup toolchain list

      - name: Check out succinctlabs/rust
        uses: actions/checkout@v3
        with:
          submodules: "recursive"
          path: rust
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Build
        run: |
          cd rust
          ./build_toolchain_succinct.sh

      - name: Archive build output
        uses: actions/upload-artifact@v4
        with:
          name: rust-toolchain-aarch64-unknown-linux-gnu
          path: rust/rust-toolchain-aarch64-unknown-linux-gnu.tar.gz
