name: CI

on:
  workflow_call:
    inputs:
      require-llvm-cache:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      require-llvm-cache:
        description: Require an exact LLVM cache hit when validating a warm build
        type: boolean
        default: false

env:
  RUSTUP_TOOLCHAIN: 1.98.0
  SP1_BUILDER_REVISION: a3f98a36431af2d5c0789702b3b6510565a4f391

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # https://github.com/actions/runner-images/issues/13046
          - os: macos-14
            triple: aarch64-apple-darwin
          - os: macos-15-intel
            triple: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Rust
        run: rustup toolchain install --no-self-update --profile minimal "$RUSTUP_TOOLCHAIN"
      - uses: lukka/get-cmake@v3.27.4

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.24.11
          check-latest: true

      - name: Show rust version
        run: |
          cargo version
          rustup toolchain list

      - name: Check out succinctlabs/rust
        uses: actions/checkout@v5
        with:
          path: rust
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Check out succinctlabs/sp1
        uses: actions/checkout@v5
        with:
          repository: succinctlabs/sp1
          ref: ${{ env.SP1_BUILDER_REVISION }}
          path: sp1

      # Bootstrap fetches only the submodules needed by compiler/rustc and library.
      - name: Check shallow source metadata and cache key tests
        shell: bash
        run: |
          test "$(git -C rust rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C rust rev-parse --is-shallow-repository)" = true
          git -C rust log -1 --format='%H %cs'
          python3 rust/.github/scripts/test-llvm-cache-key.py

      - name: Retain compiler commit metadata
        run: python3 rust/.github/scripts/configure-toolchain.py sp1

      - name: Identify LLVM build inputs
        id: llvm-key
        shell: bash
        run: |
          key=$(python3 rust/.github/scripts/llvm-cache-key.py '${{ matrix.triple }}')
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore installed LLVM
        id: llvm-cache
        uses: actions/cache@v4
        with:
          # Keep the install and bootstrap stamp, without intermediate objects.
          path: |
            rust/build/${{ matrix.triple }}/llvm
            !rust/build/${{ matrix.triple }}/llvm/build
          key: ${{ steps.llvm-key.outputs.key }}

      - name: Check LLVM cache result
        shell: bash
        env:
          CACHE_HIT: ${{ steps.llvm-cache.outputs.cache-hit }}
          REQUIRE_HIT: ${{ inputs.require-llvm-cache }}
        run: |
          echo "LLVM cache hit: ${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$REQUIRE_HIT" = true ] && [ "$CACHE_HIT" != true ]; then
            echo "Expected an exact LLVM cache hit." >&2
            exit 1
          fi
          if [ "$CACHE_HIT" = true ]; then
            test -s 'rust/build/${{ matrix.triple }}/llvm/.llvm-stamp'
            'rust/build/${{ matrix.triple }}/llvm/bin/llvm-config' --version
          fi

      - name: Test toolchain archive validation
        run: python3 rust/.github/scripts/test-validate-toolchain.py

      - name: Build
        shell: bash
        env:
          CACHE_HIT: ${{ steps.llvm-cache.outputs.cache-hit }}
        run: |
          cd sp1/crates/cli
          SECONDS=0
          GITHUB_ACTIONS=false SP1_BUILD_DIR="$GITHUB_WORKSPACE" cargo run --locked --no-default-features --bin cargo-prove -- prove build-toolchain 2>&1 | tee toolchain-build.log
          echo "Toolchain build: $SECONDS seconds" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CACHE_HIT" = true ] && grep -q 'Building LLVM for' toolchain-build.log; then
            echo "LLVM rebuilt despite an exact cache hit." >&2
            exit 1
          fi

      - name: Check built compiler provenance
        shell: bash
        run: |
          'rust/build/${{ matrix.triple }}/stage2/bin/rustc' -vV | tee rustc-version.txt
          grep -Fx "commit-hash: $GITHUB_SHA" rustc-version.txt
          test -s 'rust/build/${{ matrix.triple }}/llvm/.llvm-stamp'

      - name: Validate toolchain archive
        run: bash rust/.github/scripts/validate-toolchain.sh "sp1/crates/cli/rust-toolchain-${{ matrix.triple }}.tar.gz"

      - name: Test LTO guest builds and execution
        run: python3 rust/.github/scripts/test-toolchain-lto.py "sp1/crates/cli/rust-toolchain-${{ matrix.triple }}.tar.gz"

      - name: Archive build output
        uses: actions/upload-artifact@v4
        with:
          name: rust-toolchain-${{ matrix.triple }}
          path: sp1/crates/cli/rust-toolchain-${{ matrix.triple }}.tar.gz
          if-no-files-found: error

  build-runs-on:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: 32cpu-linux-arm64
            image: ubuntu22-full-arm64
            triple: aarch64-unknown-linux-gnu
          - runner: 32cpu-linux-x64
            image: ubuntu22-full-x64
            triple: x86_64-unknown-linux-gnu
    runs-on: [runs-on, "runner=${{ matrix.runner }}", "image=${{ matrix.image }}", disk=large, "run-id=${{ github.run_id }}"]
    steps:
      - name: Install Rust
        run: rustup toolchain install --no-self-update --profile minimal "$RUSTUP_TOOLCHAIN"
      - uses: lukka/get-cmake@v3.27.4

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.24.11
          check-latest: true

      - name: Show rust version
        run: |
          cargo version
          rustup toolchain list

      - name: Check out succinctlabs/rust
        uses: actions/checkout@v5
        with:
          path: rust
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Check out succinctlabs/sp1
        uses: actions/checkout@v5
        with:
          repository: succinctlabs/sp1
          ref: ${{ env.SP1_BUILDER_REVISION }}
          path: sp1

      # Bootstrap fetches only the submodules needed by compiler/rustc and library.
      - name: Check shallow source metadata and cache key tests
        shell: bash
        run: |
          test "$(git -C rust rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C rust rev-parse --is-shallow-repository)" = true
          git -C rust log -1 --format='%H %cs'
          python3 rust/.github/scripts/test-llvm-cache-key.py

      - name: Retain compiler commit metadata
        run: python3 rust/.github/scripts/configure-toolchain.py sp1

      - name: Identify LLVM build inputs
        id: llvm-key
        shell: bash
        run: |
          key=$(python3 rust/.github/scripts/llvm-cache-key.py '${{ matrix.triple }}')
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore installed LLVM
        id: llvm-cache
        uses: actions/cache@v4
        with:
          # Keep the install and bootstrap stamp, without intermediate objects.
          path: |
            rust/build/${{ matrix.triple }}/llvm
            !rust/build/${{ matrix.triple }}/llvm/build
          key: ${{ steps.llvm-key.outputs.key }}

      - name: Check LLVM cache result
        shell: bash
        env:
          CACHE_HIT: ${{ steps.llvm-cache.outputs.cache-hit }}
          REQUIRE_HIT: ${{ inputs.require-llvm-cache }}
        run: |
          echo "LLVM cache hit: ${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$REQUIRE_HIT" = true ] && [ "$CACHE_HIT" != true ]; then
            echo "Expected an exact LLVM cache hit." >&2
            exit 1
          fi
          if [ "$CACHE_HIT" = true ]; then
            test -s 'rust/build/${{ matrix.triple }}/llvm/.llvm-stamp'
            'rust/build/${{ matrix.triple }}/llvm/bin/llvm-config' --version
          fi

      - name: Test toolchain archive validation
        run: python3 rust/.github/scripts/test-validate-toolchain.py

      - name: Build
        shell: bash
        env:
          CACHE_HIT: ${{ steps.llvm-cache.outputs.cache-hit }}
        run: |
          cd sp1/crates/cli
          SECONDS=0
          GITHUB_ACTIONS=false SP1_BUILD_DIR="$GITHUB_WORKSPACE" cargo run --locked --no-default-features --bin cargo-prove -- prove build-toolchain 2>&1 | tee toolchain-build.log
          echo "Toolchain build: $SECONDS seconds" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CACHE_HIT" = true ] && grep -q 'Building LLVM for' toolchain-build.log; then
            echo "LLVM rebuilt despite an exact cache hit." >&2
            exit 1
          fi

      - name: Check built compiler provenance
        shell: bash
        run: |
          'rust/build/${{ matrix.triple }}/stage2/bin/rustc' -vV | tee rustc-version.txt
          grep -Fx "commit-hash: $GITHUB_SHA" rustc-version.txt
          test -s 'rust/build/${{ matrix.triple }}/llvm/.llvm-stamp'

      - name: Validate toolchain archive
        run: bash rust/.github/scripts/validate-toolchain.sh "sp1/crates/cli/rust-toolchain-${{ matrix.triple }}.tar.gz"

      - name: Test LTO guest builds and execution
        run: python3 rust/.github/scripts/test-toolchain-lto.py "sp1/crates/cli/rust-toolchain-${{ matrix.triple }}.tar.gz"

      - name: Archive build output
        uses: actions/upload-artifact@v4
        with:
          name: rust-toolchain-${{ matrix.triple }}
          path: sp1/crates/cli/rust-toolchain-${{ matrix.triple }}.tar.gz
          if-no-files-found: error
